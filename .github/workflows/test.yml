name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Run unit tests (no QGIS required)
        run: uv run pytest

  qgis-tests:
    # QGIS-bound / end-to-end tests run inside a real (headless) QGIS via
    # pytest-qgis. See scripts/install_qgis_ubuntu.sh and run_qgis_tests.sh.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install QGIS + python3-qgis + create uv QGIS venv
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gpg ca-certificates
          # sudo resets PATH, so hand over the uv binary from setup-uv explicitly.
          sudo UBUNTU_CODENAME=noble UV_BIN="$(command -v uv)" scripts/install_qgis_ubuntu.sh

      - name: Run QGIS-bound tests (offscreen)
        run: scripts/run_qgis_tests.sh -q
